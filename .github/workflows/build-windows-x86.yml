name: Build 32-bit Windows application

on:
  workflow_dispatch:

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up 32-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x86"
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build 32-bit executable
        run: python -m PyInstaller --noconfirm --clean packaging/landdocs.spec
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/LandDocs.exe -DestinationPath LandDocs-Windows-x86.zip
      - name: Upload 32-bit package
        uses: actions/upload-artifact@v4
        with:
          name: LandDocs-Windows-x86
          path: LandDocs-Windows-x86.zip
