name: Build Windows application

on:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean packaging/landdocs.spec
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/LandDocs.exe -DestinationPath LandDocs-Windows.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LandDocs-Windows
          path: LandDocs-Windows.zip
